set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-features "*:hyperlinks"

# Prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Splits
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Resize panes
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
bind -r m resize-pane -Z

# Session root to current path
bind M-c attach-session -c "#{pane_current_path}"

# Mouse
set -g mouse on

# Vi mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi Enter send-keys -X cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Neovim
set -sg escape-time 10
set-option -g focus-events on

# Misc
set-option -g history-limit 100000
set -g set-titles on
set -g set-titles-string "#T"

# Status bar (gruvbox)
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 2
set-option -g status-style "fg=#bdae93,bg=#1d2021"
set -g status-left "#[fg=#1d2021,bg=#fabd2f,bold] #S #[fg=#fabd2f,bg=#1d2021,nobold] "
set -g status-right "#[fg=#bdae93,bg=#3c3836] 󰋊 #(df -H / | awk 'NR==2 {print $4\" / \"$2}') #[fg=#1d2021,bg=#fabd2f,bold] %H:%M "
set-window-option -g window-status-style "fg=#bdae93,bg=#1d2021"
set-window-option -g window-status-format "#[fg=#bdae93,bg=#3c3836] #I:#W "
set-window-option -g window-status-current-style "fg=#fabd2f,bg=#504945"
set-window-option -g window-status-current-format "#[fg=#fabd2f,bg=#504945,bold] #I:#W "
set -g window-status-separator ""
set-option -g pane-border-style "fg=#3c3836"
set-option -g pane-active-border-style "fg=#504945"
set-option -g message-style "fg=#d5c4a1,bg=#3c3836"
set-option -g display-panes-active-colour "#b8bb26"
set-option -g display-panes-colour "#fabd2f"
set-window-option -g clock-mode-colour "#b8bb26"
set-window-option -g mode-style "fg=#bdae93,bg=#504945"
set-window-option -g window-status-bell-style "fg=#3c3836,bg=#fb4934"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Keep this last
run '~/.tmux/plugins/tpm/tpm'